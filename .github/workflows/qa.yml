name: QuickBuy QA
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PWA syntax and manifest
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/dashboard.js
          node --check docs/pwa-adapter.js
          node --check docs/pwa-boot.js
          node --check docs/platform-catalog.js
          node --check docs/sync-core.js
          node --check docs/sync-crypto.js
          node --check docs/sync-provider.js
          node --check docs/sw.js
          node -e "JSON.parse(require('fs').readFileSync('docs/manifest.webmanifest','utf8')); console.log('manifest PASS')"
      - name: PWA offline shell references
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html tutorial.html manifest.webmanifest pwa-adapter.js platform-catalog.js sync-core.js sync-crypto.js sync-provider.js dashboard.js pwa-boot.js icons/icon192.png icons/icon512.png tutorial/01-first-open.png tutorial/02-home.png tutorial/03-platform.png tutorial/03-url.png tutorial/04-prep.png tutorial/05-more.png; do
            test -f "docs/$f" || { echo "Missing docs/$f"; exit 1; }
            grep -q "$f" docs/sw.js || { echo "Service worker missing $f"; exit 1; }
          done
          echo "offline shell PASS"
      - name: Platform URL detection regression
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_platform_detection.mjs
      - name: Sync functional URL regression
        shell: bash
        run: |
          set -euo pipefail
          node tools/test_sync_urls.mjs
      - name: Safety regression
        shell: bash
        run: |
          set -euo pipefail
          grep -q "驗證碼" docs/index.html
          grep -q "OTP" docs/platform-catalog.js
          grep -q "QUEUE" docs/platform-catalog.js
          grep -q "最後確認" docs/dashboard.js
          echo "safety boundary PASS"
      - name: Release metadata
        shell: bash
        run: |
          test -f release-assets/windows.part.06
          echo "release chunks PASS"
