name: Publish QuickBuy 1.0
on:
  workflow_run:
    workflows: ['Windows Extension Runtime']
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Package the exact Windows-accepted commit
        run: |
          python tools/package_windows.py --verify
          python tools/package_windows.py
          cd runtime-results
          sha256sum -c QuickBuy-1.0-SHA256SUMS.txt
          unzip -t QuickBuy-1.0-Windows.zip
      - name: Publish verified Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 runtime-results/QuickBuy-1.0-Windows.zip runtime-results/QuickBuy-1.0-SHA256SUMS.txt --clobber
          else
            gh release create v1.0.0 runtime-results/QuickBuy-1.0-Windows.zip runtime-results/QuickBuy-1.0-SHA256SUMS.txt --target "$VERIFIED_SHA" --title 'QuickBuy 1.0' --notes 'Windows runtime verified; login, verification, queue, payment and final confirmation remain manual.'
          fi
