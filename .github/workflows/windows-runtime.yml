name: Windows Extension Runtime
on:
  push:
    branches: [main, 'fix/windows-runtime-*']
    paths: ['windows/**', 'tools/**', '.github/workflows/windows-runtime.yml', 'docs/platform-catalog.js', 'docs/sync-core.js']
  pull_request:
    paths: ['windows/**', 'tools/**', '.github/workflows/windows-runtime.yml', 'docs/platform-catalog.js', 'docs/sync-core.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, chrome, msedge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependency
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Install Chrome for Testing
        if: matrix.browser == 'chromium'
        run: npx playwright install chromium
      - name: Verify tested source hashes
        run: python tools/package_windows.py --verify
      - name: Verify shared functional URL rules
        run: node tools/test_windows_urls.cjs
      - name: Real unpacked extension acceptance
        shell: pwsh
        run: ./tools/windows_extension_smoke.ps1 -Browser '${{ matrix.browser }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-${{ matrix.browser }}-${{ github.sha }}
          path: runtime-results/
          if-no-files-found: error
