name: Mobile Live Runtime Smoke
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/mobile-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed files match repository
        shell: bash
        run: |
          set -euo pipefail
          base="https://ykc1117.github.io/quickbuy"
          wait_match() {
            local f="$1"
            local tmp="/tmp/quickbuy-$(echo "$f" | tr '/' '_')"
            for i in $(seq 1 30); do
              if curl -fsSL "$base/$f?smoke=${GITHUB_SHA}-$i" -o "$tmp" && cmp -s "docs/$f" "$tmp"; then
                return 0
              fi
              sleep 3
            done
            echo "Timed out waiting for deployed $f to match repository"
            return 1
          }
          for f in index.html dashboard.js pwa-boot.js pwa-adapter.js platform-catalog.js sync-core.js sync-crypto.js sync-provider.js sw.js manifest.webmanifest; do
            wait_match "$f"
          done
          echo "LIVE_FILE_MATCH_PASS"
          wait_match "tutorial.html"
          grep -q "QuickBuy 怎麼用" docs/tutorial.html
          grep -q "第一次使用？看圖片教學" docs/index.html
          for f in 01-first-open.png 02-home.png 03-platform.png 03-url.png 04-prep.png 05-more.png; do
            wait_match "tutorial/$f"
            tmp="/tmp/quickbuy-tutorial_$f"
            test -s "$tmp"
            printf "%s: " "$f"
            file "$tmp"
            xxd -l 16 "$tmp"
            python3 -c 'import sys; p=sys.argv[1]; sig=open(p,"rb").read(8).hex(); assert sig=="89504e470d0a1a0a", f"not png: {p}"' "$tmp"
          done
          echo "TUTORIAL_LIVE_ASSETS_PASS"

      - name: Install browser test harness
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Run iPhone-size interaction smoke
        shell: bash
        run: |
          cat > quickbuy-smoke.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import { existsSync } from 'fs';

          const candidates=[
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser'
          ];
          const executablePath=candidates.find(existsSync);
          if(!executablePath) throw new Error('Chrome/Chromium not found');

          const browser=await chromium.launch({
            headless:true,
            executablePath,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });

          const CORE_RE=/\/(index\.html|dashboard\.js|pwa-boot\.js|pwa-adapter\.js|platform-catalog\.js|sync-core\.js|sync-crypto\.js|sync-provider\.js|sw\.js|manifest\.webmanifest|icons\/icon(?:192|512)\.png)(?:\?|$)/;

          async function runCase(viewport,label){
            const context=await browser.newContext({
              viewport,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page=await context.newPage();
            const errors=[];
            const badCore=[];
            async function installOpenProbe(){
              await page.evaluate(()=>{
                window.__qbOpenEvents=[];
                window.open=(url,target,features)=>{
                  const popup={
                    opener:null,
                    closed:false,
                    close(){this.closed=true;},
                    location:{
                      current:String(url||''),
                      replace(next){this.current=String(next||'');window.__qbOpenEvents.push({kind:'replace',url:this.current});}
                    }
                  };
                  Object.defineProperty(popup.location,'href',{
                    get(){return this.current;},
                    set(next){this.current=String(next||'');window.__qbOpenEvents.push({kind:'href',url:this.current});}
                  });
                  window.__qbOpenEvents.push({kind:'open',url:String(url||''),target:String(target||'')});
                  return popup;
                };
              });
            }
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('response',res=>{
              try{
                const u=new URL(res.url());
                if(u.hostname==='ykc1117.github.io' && CORE_RE.test(u.pathname) && res.status()>=400){
                  badCore.push(res.status()+' '+res.url());
                }
              }catch{}
            });

            await page.goto('https://ykc1117.github.io/quickbuy/?runtime='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle'});
            // Intercept PWA window.open so we can verify user-gesture opening order without depending on third-party sites.
            await installOpenProbe();

            const onboarding=page.locator('#mobileOnboarding');
            if(await onboarding.count() && await onboarding.isVisible().catch(()=>false)){
              const done=page.locator('#mobileOnboardingDoneBtn');
              if(await done.count()) await done.click();
            }

            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});
            const qty=page.locator('#mobileQty');
            if(await qty.inputValue()!=='1') throw new Error(label+': initial qty is not 1');

            await page.locator('#mobileQtyPlus').click();
            if(await qty.inputValue()!=='2') throw new Error(label+': qty plus failed');
            await page.locator('#mobileQtyMinus').click();
            if(await qty.inputValue()!=='1') throw new Error(label+': qty minus failed');

            await page.locator('#mobileKeyword').fill('A區');
            await page.locator('#mobileKeyword').blur();

            // First-use speed regression: Home "貼網址" should read clipboard and auto-detect in one tap when no target exists.
            await page.evaluate(()=>{
              Object.defineProperty(navigator,'clipboard',{
                configurable:true,
                value:{readText:async()=> '蝦皮分享 https://tw.shp.ee/HomePaste123'}
              });
            });
            const homePasteBtn=page.locator('#mobileSwapTargetBtn');
            const homePasteText=(await homePasteBtn.textContent()||'').trim();
            if(!homePasteText.includes('貼網址')) throw new Error(label+': first-use home action is not paste URL');
            await homePasteBtn.click();
            await page.locator('[data-mobile-view="platforms"]').waitFor({state:'visible'});
            await page.waitForTimeout(500);
            const oneTapUrl=await page.locator('#platformUrl').inputValue();
            if(oneTapUrl!=='https://tw.shp.ee/HomePaste123') throw new Error(label+': one-tap home paste did not normalize clipboard URL: '+oneTapUrl);
            const oneTapStatus=(await page.locator('#platformStatus').textContent()||'').trim();
            if(!oneTapStatus.includes('蝦皮')||!oneTapStatus.includes('購物平台')) throw new Error(label+': one-tap home paste did not detect Shopee: '+oneTapStatus);
            const oneTapSaved=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(oneTapSaved?.platformId!=='shopee-tw'||oneTapSaved?.targetUrl!=='https://tw.shp.ee/HomePaste123') throw new Error(label+': one-tap home paste did not save target');

            await page.locator('#mobileClearTargetBtn').click().catch(()=>{});
            await page.locator('[data-mobile-tab="platforms"]').click();
            await page.locator('[data-mobile-view="platforms"]').waitFor({state:'visible'});

            // Real pasted-share regression: Shopee copied text + short URL must be recognized and applied.
            await page.locator('#platformUrl').fill('蝦皮分享給你：https://tw.shp.ee/AbCdEf 這個商品');
            await page.waitForTimeout(700);
            const pastedStatus=(await page.locator('#platformStatus').textContent()||'').trim();
            if(!pastedStatus.includes('蝦皮') || !pastedStatus.includes('購物平台')) throw new Error(label+': pasted Shopee share text was not recognized: '+pastedStatus);
            const normalizedPasted=await page.locator('#platformUrl').inputValue();
            if(normalizedPasted!=='https://tw.shp.ee/AbCdEf') throw new Error(label+': pasted Shopee URL was not normalized: '+normalizedPasted);
            const pastedSaved=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(pastedSaved?.platformId!=='shopee-tw') throw new Error(label+': pasted Shopee URL did not save shopee-tw');
            if(!String(pastedSaved?.targetUrl||'').startsWith('https://tw.shp.ee/')) throw new Error(label+': pasted Shopee target URL was not saved');

            // Functional-query regression: momo product id must survive while token/tracking are removed immediately.
            await page.locator('#platformUrl').fill('https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=123456&token=secret&utm_source=runtime');
            await page.waitForTimeout(700);
            const momoStatus=(await page.locator('#platformStatus').textContent()||'').trim();
            if(!momoStatus.includes('momo') || !momoStatus.includes('購物平台')) throw new Error(label+': momo product URL was not recognized: '+momoStatus);
            const momoInput=await page.locator('#platformUrl').inputValue();
            if(momoInput!=='https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=123456') throw new Error(label+': momo URL cleanup broke functional query: '+momoInput);
            const momoSaved=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(momoSaved?.platformId!=='momo') throw new Error(label+': momo URL did not save momo platform');
            if(momoSaved?.targetUrl!=='https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=123456') throw new Error(label+': momo functional query was not preserved in target');
            const detectedOpenBtn=page.locator('#platformOpenTargetBtn');
            if(!(await detectedOpenBtn.isVisible())) throw new Error(label+': detected-target open button missing');
            const detectedOpenText=(await detectedOpenBtn.textContent()||'').trim();
            if(!detectedOpenText.includes('momo')) throw new Error(label+': detected-target open button label is wrong: '+detectedOpenText);
            const opensBeforeDetected=await page.evaluate(()=>window.__qbOpenEvents.length);
            await detectedOpenBtn.click();
            await page.waitForTimeout(200);
            const detectedEvents=await page.evaluate(n=>window.__qbOpenEvents.slice(n),opensBeforeDetected);
            if(!detectedEvents.some(x=>x.kind==='open'&&x.url==='about:blank')) throw new Error(label+': detected-target open did not pre-open a PWA tab');
            if(!detectedEvents.some(x=>(x.kind==='replace'||x.kind==='href')&&x.url==='https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=123456')) throw new Error(label+': detected-target open did not preserve exact momo product URL');

            await page.locator('#platformSearch').fill('拓元');

            const visibleButtons=page.locator('#platformQuickPick button:visible, #ticketPlatformQuickPick button:visible, #shoppingPlatformQuickPick button:visible');
            if(await visibleButtons.count()<1) throw new Error(label+': platform search produced no selectable platform');
            const opensBeforePlatform=await page.evaluate(()=>window.__qbOpenEvents.length);
            await visibleButtons.first().click();
            await page.waitForTimeout(500);
            const platformOpenEvents=await page.evaluate(n=>window.__qbOpenEvents.slice(n),opensBeforePlatform);
            if(!platformOpenEvents.some(x=>x.kind==='open'&&x.url==='about:blank')) throw new Error(label+': platform selection did not pre-open a PWA tab');
            if(!platformOpenEvents.some(x=>(x.kind==='replace'||x.kind==='href')&&/^https?:/.test(x.url))) throw new Error(label+': platform selection did not navigate pre-opened tab');

            const saved=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(!saved?.platformId) throw new Error(label+': selected platform was not saved');
            if(!String(saved.targetUrl||'').startsWith('http')) throw new Error(label+': selected target URL was not saved');
            if(saved.keyword!=='A區') throw new Error(label+': keyword was not saved with prep');

            await page.locator('[data-mobile-tab="home"]').click();
            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});

            await page.reload({waitUntil:'networkidle'});
            await installOpenProbe();
            if(await onboarding.count() && await onboarding.isVisible().catch(()=>false)){
              const done=page.locator('#mobileOnboardingDoneBtn');
              if(await done.count()) await done.click();
            }
            const keyword=await page.locator('#mobileKeyword').inputValue();
            if(keyword!=='A區') throw new Error(label+': keyword did not persist after reload');
            const savedAfter=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(savedAfter?.platformId!==saved.platformId) throw new Error(label+': selected platform did not persist after reload');
            if(savedAfter?.targetUrl!==saved.targetUrl) throw new Error(label+': target URL did not persist after reload');

            await page.locator('[data-mobile-tab="platforms"]').click();
            await page.locator('[data-mobile-view="platforms"]').waitFor({state:'visible'});
            await page.locator('[data-mobile-tab="more"]').click();
            await page.locator('[data-mobile-view="more"]').waitFor({state:'visible'});
            await page.locator('[data-mobile-tab="home"]').click();
            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});

            const nextBtn=page.locator('#mobileNextActionBtn');
            if(await nextBtn.count()<1 || !(await nextBtn.isVisible())) throw new Error(label+': primary next action missing');

            // Reopen target must issue an immediate pre-open before async persistence.
            const opensBeforeReopen=await page.evaluate(()=>window.__qbOpenEvents.length);
            await page.locator('#mobileReopenTargetBtn').click();
            await page.waitForTimeout(250);
            const reopenEvents=await page.evaluate(n=>window.__qbOpenEvents.slice(n),opensBeforeReopen);
            if(!reopenEvents.some(x=>x.kind==='open'&&x.url==='about:blank')) throw new Error(label+': reopen target did not pre-open a PWA tab');
            if(!reopenEvents.some(x=>(x.kind==='replace'||x.kind==='href')&&/^https?:/.test(x.url))) throw new Error(label+': reopen target did not navigate pre-opened tab');

            // PWA-only redundant "use current" button should remain hidden.
            if(await page.locator('#mobileUseCurrentBtn').isVisible()) throw new Error(label+': redundant PWA use-current button is visible');

            // Clipboard shortcut entry must prefill a sanitized functional URL.
            await page.locator('[data-mobile-tab="more"]').click();
            await page.locator('[data-mobile-view="more"]').waitFor({state:'visible'});
            await page.evaluate(()=>{
              Object.defineProperty(navigator,'clipboard',{
                configurable:true,
                value:{readText:async()=> 'momo 分享 https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=777888&token=secret&utm_source=clipboard'}
              });
            });
            await page.locator('#saveCurrentShortcutBtn').click();
            await page.locator('#shortcutForm').waitFor({state:'visible'});
            const clipboardUrl=await page.locator('#shortcutUrl').inputValue();
            if(clipboardUrl!=='https://www.momoshop.com.tw/goods/GoodsDetail.jsp?i_code=777888') throw new Error(label+': clipboard shortcut was not sanitized/prefilled: '+clipboardUrl);
            await page.locator('#shortcutCancelBtn').click();
            if(await page.locator('#shortcutForm').isVisible()) throw new Error(label+': clipboard shortcut form did not close');

            // Custom shortcut: create it through the real UI, then verify PWA pre-open navigation.
            await page.locator('#addShortcutBtn').click();
            await page.locator('#shortcutForm').waitFor({state:'visible'});
            const maliciousShortcutName='測試<svg/onload=alert(1)>';
            await page.locator('#shortcutName').fill(maliciousShortcutName);
            await page.locator('#shortcutUrl').fill('https://example.com/runtime?item=123&token=secret');
            await page.locator('#shortcutCategory').selectOption('');
            await page.locator('#shortcutSaveBtn').click();
            await page.waitForTimeout(300);
            if(await page.locator('#shortcutForm').isVisible()) throw new Error(label+': shortcut form did not close after save');
            if(await page.locator('#shortcutList svg, #shortcutList img').count()>0) throw new Error(label+': shortcut renderer created HTML from user-controlled name');
            const shortcutCard=page.locator('#shortcutList .shortcut-card').filter({hasText:maliciousShortcutName}).first();
            if(await shortcutCard.count()<1) throw new Error(label+': custom shortcut did not render literal user-controlled text after UI save');
            const shortcutOpen=shortcutCard.locator('button[data-action="open"]');
            const opensBeforeShortcut=await page.evaluate(()=>window.__qbOpenEvents.length);
            await shortcutOpen.click();
            await page.waitForTimeout(250);
            const shortcutEvents=await page.evaluate(n=>window.__qbOpenEvents.slice(n),opensBeforeShortcut);
            if(!shortcutEvents.some(x=>x.kind==='open'&&x.url==='about:blank')) throw new Error(label+': shortcut did not pre-open a PWA tab');
            if(!shortcutEvents.some(x=>(x.kind==='replace'||x.kind==='href')&&x.url==='https://example.com/runtime?item=123')) throw new Error(label+': shortcut did not preserve functional query or navigate pre-opened tab');
            const savedShortcuts=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaCustomShortcutsV1');
              return r?.qbaCustomShortcutsV1||[];
            });
            const savedShortcut=savedShortcuts.find(x=>x.name===maliciousShortcutName);
            if(savedShortcut?.url!=='https://example.com/runtime?item=123') throw new Error(label+': shortcut sanitizer did not preserve functional query safely');
            const prepAfterShortcut=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(prepAfterShortcut?.targetUrl!=='https://example.com/runtime?item=123') throw new Error(label+': opening shortcut did not become current target');
            if(prepAfterShortcut?.keyword!=='A區') throw new Error(label+': opening shortcut unexpectedly erased prep keyword');
            await page.locator('[data-mobile-tab="home"]').click();
            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});

            // Fast-control regression: refresh keeps the latest state.
            await page.locator('#mobileRefreshAppBtn').click();
            await page.waitForTimeout(300);
            const afterRefresh=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(afterRefresh?.targetUrl!==prepAfterShortcut.targetUrl || afterRefresh?.platformId!==prepAfterShortcut.platformId || afterRefresh?.keyword!=='A區') throw new Error(label+': refresh changed latest saved prep');

            // Swap target should jump to URL input and clear only the URL field.
            await page.locator('#mobileSwapTargetBtn').click();
            await page.locator('[data-mobile-view="platforms"]').waitFor({state:'visible'});
            if((await page.locator('#platformUrl').inputValue())!=='') throw new Error(label+': swap target did not clear URL input');

            // Pasted Shopee URL creates a recent target.
            await page.locator('#platformUrl').fill('https://tw.shp.ee/TestFast123');
            await page.waitForTimeout(650);
            await page.locator('[data-mobile-tab="home"]').click();
            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});
            const recentRows=page.locator('#mobileRecentTargets [data-recent-target-id]');
            if(await recentRows.count()<1) throw new Error(label+': recent target was not created');

            // Delete one recent target.
            const beforeDelete=await recentRows.count();
            await recentRows.first().locator('button[data-action="delete"]').click();
            await page.waitForTimeout(200);
            const afterDelete=await page.locator('#mobileRecentTargets [data-recent-target-id]').count();
            if(afterDelete!==beforeDelete-1) throw new Error(label+': recent target delete failed');

            // Clear target keeps quantity and keyword.
            await page.locator('#mobileClearTargetBtn').click();
            await page.waitForTimeout(250);
            const cleared=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(cleared?.platformId || cleared?.targetUrl) throw new Error(label+': clear target did not clear platform/url');
            if(cleared?.quantity!==1 || cleared?.keyword!=='A區') throw new Error(label+': clear target erased prep unexpectedly');

            if(errors.length) throw new Error(label+' '+errors.join('\n'));
            if(badCore.length) throw new Error(label+' core resource failures: '+badCore.join(', '));

            console.log('MOBILE_CASE_PASS '+label);
            console.log('platformId='+savedAfter.platformId);
            console.log('persisted keyword='+keyword);
            await context.close();
          }

          await runCase({width:390,height:844},'390x844');
          await runCase({width:440,height:956},'440x956');
          console.log('MOBILE_LIVE_RUNTIME_PASS');
          console.log('qty+/- PASS');
          console.log('pasted Shopee share URL detection PASS');
          console.log('home one-tap clipboard URL PASS');
          console.log('momo functional URL preservation PASS');
          console.log('detected target direct-open PASS');
          console.log('clipboard shortcut prefill PASS');
          console.log('user-controlled renderer XSS regression PASS');
          console.log('fast target controls PASS');
          console.log('PWA pre-open navigation PASS');
          console.log('platform select + persistence PASS');
          console.log('tab navigation PASS');
          console.log('core resources PASS');
          await browser.close();
          EOF
          node quickbuy-smoke.mjs
