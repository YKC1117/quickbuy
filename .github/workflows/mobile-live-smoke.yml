name: Mobile Live Runtime Smoke
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/mobile-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployed files match repository
        shell: bash
        run: |
          set -euo pipefail
          base="https://ykc1117.github.io/quickbuy"
          wait_match() {
            local f="$1"
            for i in $(seq 1 30); do
              if curl -fsSL "$base/$f?smoke=${GITHUB_SHA}-$i" -o "/tmp/$f" && cmp -s "docs/$f" "/tmp/$f"; then
                return 0
              fi
              sleep 3
            done
            echo "Timed out waiting for deployed $f to match repository"
            return 1
          }
          for f in index.html dashboard.js pwa-boot.js pwa-adapter.js platform-catalog.js sync-core.js sync-crypto.js sync-provider.js sw.js manifest.webmanifest; do
            wait_match "$f"
          done
          echo "LIVE_FILE_MATCH_PASS"
          curl -fsSL --retry 5 --retry-delay 2 "$base/tutorial.html?smoke=${GITHUB_SHA}" -o /tmp/tutorial.html
          grep -q "QuickBuy 怎麼用" /tmp/tutorial.html
          cmp docs/tutorial.html /tmp/tutorial.html
          grep -q "第一次使用？看圖片教學" docs/index.html
          for f in 01-first-open.png 02-home.png 03-platform.png 04-prep.png 05-more.png; do
            curl -fsSL --retry 5 --retry-delay 2 "$base/tutorial/$f?smoke=${GITHUB_SHA}" -o "/tmp/$f"
            test -s "/tmp/$f"
            cmp "docs/tutorial/$f" "/tmp/$f"
            printf "%s: " "$f"
            file "/tmp/$f"
            xxd -l 16 "/tmp/$f"
            python3 -c 'import sys; p="/tmp/"+sys.argv[1]; sig=open(p,"rb").read(8).hex(); assert sig=="89504e470d0a1a0a", f"not png: {p}"' "$f"
          done
          echo "TUTORIAL_LIVE_ASSETS_PASS"

      - name: Install browser test harness
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core@1.55.0 >/dev/null 2>&1
          command -v google-chrome || command -v chromium || command -v chromium-browser
      - name: Run iPhone-size interaction smoke
        shell: bash
        run: |
          cat > quickbuy-smoke.mjs <<'EOF'
          import { chromium } from 'playwright-core';
          import { existsSync } from 'fs';

          const candidates=[
            '/usr/bin/google-chrome',
            '/usr/bin/google-chrome-stable',
            '/usr/bin/chromium',
            '/usr/bin/chromium-browser'
          ];
          const executablePath=candidates.find(existsSync);
          if(!executablePath) throw new Error('Chrome/Chromium not found');

          const browser=await chromium.launch({
            headless:true,
            executablePath,
            args:['--no-sandbox','--disable-dev-shm-usage']
          });

          const CORE_RE=/\/(index\.html|dashboard\.js|pwa-boot\.js|pwa-adapter\.js|platform-catalog\.js|sync-core\.js|sync-crypto\.js|sync-provider\.js|sw\.js|manifest\.webmanifest|icons\/icon(?:192|512)\.png)(?:\?|$)/;

          async function runCase(viewport,label){
            const context=await browser.newContext({
              viewport,
              userAgent:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'
            });
            const page=await context.newPage();
            const errors=[];
            const badCore=[];
            page.on('pageerror',e=>errors.push('pageerror: '+e.message));
            page.on('response',res=>{
              try{
                const u=new URL(res.url());
                if(u.hostname==='ykc1117.github.io' && CORE_RE.test(u.pathname) && res.status()>=400){
                  badCore.push(res.status()+' '+res.url());
                }
              }catch{}
            });

            await page.goto('https://ykc1117.github.io/quickbuy/?runtime='+Date.now(),{waitUntil:'networkidle',timeout:60000});
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle'});

            const onboarding=page.locator('#mobileOnboarding');
            if(await onboarding.count() && await onboarding.isVisible().catch(()=>false)){
              const done=page.locator('#mobileOnboardingDoneBtn');
              if(await done.count()) await done.click();
            }

            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});
            const qty=page.locator('#mobileQty');
            if(await qty.inputValue()!=='1') throw new Error(label+': initial qty is not 1');

            await page.locator('#mobileQtyPlus').click();
            if(await qty.inputValue()!=='2') throw new Error(label+': qty plus failed');
            await page.locator('#mobileQtyMinus').click();
            if(await qty.inputValue()!=='1') throw new Error(label+': qty minus failed');

            await page.locator('#mobileKeyword').fill('A區');
            await page.locator('#mobileKeyword').blur();

            await page.locator('[data-mobile-tab="platforms"]').click();
            await page.locator('[data-mobile-view="platforms"]').waitFor({state:'visible'});

            // Real pasted-share regression: Shopee copied text + short URL must be recognized and applied.
            await page.locator('#platformUrl').fill('蝦皮分享給你：https://tw.shp.ee/AbCdEf 這個商品');
            await page.waitForTimeout(700);
            const pastedStatus=(await page.locator('#platformStatus').textContent()||'').trim();
            if(!pastedStatus.includes('蝦皮') || !pastedStatus.includes('購物平台')) throw new Error(label+': pasted Shopee share text was not recognized: '+pastedStatus);
            const normalizedPasted=await page.locator('#platformUrl').inputValue();
            if(normalizedPasted!=='https://tw.shp.ee/AbCdEf') throw new Error(label+': pasted Shopee URL was not normalized: '+normalizedPasted);
            const pastedSaved=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(pastedSaved?.platformId!=='shopee-tw') throw new Error(label+': pasted Shopee URL did not save shopee-tw');
            if(!String(pastedSaved?.targetUrl||'').startsWith('https://tw.shp.ee/')) throw new Error(label+': pasted Shopee target URL was not saved');

            await page.locator('#platformSearch').fill('拓元');

            const visibleButtons=page.locator('#platformQuickPick button:visible, #ticketPlatformQuickPick button:visible, #shoppingPlatformQuickPick button:visible');
            if(await visibleButtons.count()<1) throw new Error(label+': platform search produced no selectable platform');
            await visibleButtons.first().click();
            await page.waitForTimeout(500);

            const saved=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(!saved?.platformId) throw new Error(label+': selected platform was not saved');
            if(!String(saved.targetUrl||'').startsWith('http')) throw new Error(label+': selected target URL was not saved');
            if(saved.keyword!=='A區') throw new Error(label+': keyword was not saved with prep');

            await page.locator('[data-mobile-tab="home"]').click();
            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});

            await page.reload({waitUntil:'networkidle'});
            if(await onboarding.count() && await onboarding.isVisible().catch(()=>false)){
              const done=page.locator('#mobileOnboardingDoneBtn');
              if(await done.count()) await done.click();
            }
            const keyword=await page.locator('#mobileKeyword').inputValue();
            if(keyword!=='A區') throw new Error(label+': keyword did not persist after reload');
            const savedAfter=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(savedAfter?.platformId!==saved.platformId) throw new Error(label+': selected platform did not persist after reload');
            if(savedAfter?.targetUrl!==saved.targetUrl) throw new Error(label+': target URL did not persist after reload');

            await page.locator('[data-mobile-tab="platforms"]').click();
            await page.locator('[data-mobile-view="platforms"]').waitFor({state:'visible'});
            await page.locator('[data-mobile-tab="more"]').click();
            await page.locator('[data-mobile-view="more"]').waitFor({state:'visible'});
            await page.locator('[data-mobile-tab="home"]').click();
            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});

            const nextBtn=page.locator('#mobileNextActionBtn');
            if(await nextBtn.count()<1 || !(await nextBtn.isVisible())) throw new Error(label+': primary next action missing');

            // Fast-control regression: refresh keeps state.
            await page.locator('#mobileRefreshAppBtn').click();
            await page.waitForTimeout(300);
            const afterRefresh=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(afterRefresh?.platformId!==savedAfter.platformId || afterRefresh?.keyword!=='A區') throw new Error(label+': refresh changed saved prep');

            // Swap target should jump to URL input and clear only the URL field.
            await page.locator('#mobileSwapTargetBtn').click();
            await page.locator('[data-mobile-view="platforms"]').waitFor({state:'visible'});
            if((await page.locator('#platformUrl').inputValue())!=='') throw new Error(label+': swap target did not clear URL input');

            // Pasted Shopee URL creates a recent target.
            await page.locator('#platformUrl').fill('https://tw.shp.ee/TestFast123');
            await page.waitForTimeout(650);
            await page.locator('[data-mobile-tab="home"]').click();
            await page.locator('[data-mobile-view="home"]').waitFor({state:'visible'});
            const recentRows=page.locator('#mobileRecentTargets [data-recent-target-id]');
            if(await recentRows.count()<1) throw new Error(label+': recent target was not created');

            // Delete one recent target.
            const beforeDelete=await recentRows.count();
            await recentRows.first().locator('button[data-action="delete"]').click();
            await page.waitForTimeout(200);
            const afterDelete=await page.locator('#mobileRecentTargets [data-recent-target-id]').count();
            if(afterDelete!==beforeDelete-1) throw new Error(label+': recent target delete failed');

            // Clear target keeps quantity and keyword.
            await page.locator('#mobileClearTargetBtn').click();
            await page.waitForTimeout(250);
            const cleared=await page.evaluate(async()=>{
              const r=await globalThis.QBA_PWA_API.storage.local.get('qbaMobilePrepV1');
              return r?.qbaMobilePrepV1||null;
            });
            if(cleared?.platformId || cleared?.targetUrl) throw new Error(label+': clear target did not clear platform/url');
            if(cleared?.quantity!==1 || cleared?.keyword!=='A區') throw new Error(label+': clear target erased prep unexpectedly');

            if(errors.length) throw new Error(label+' '+errors.join('\n'));
            if(badCore.length) throw new Error(label+' core resource failures: '+badCore.join(', '));

            console.log('MOBILE_CASE_PASS '+label);
            console.log('platformId='+savedAfter.platformId);
            console.log('persisted keyword='+keyword);
            await context.close();
          }

          await runCase({width:390,height:844},'390x844');
          await runCase({width:440,height:956},'440x956');
          console.log('MOBILE_LIVE_RUNTIME_PASS');
          console.log('qty+/- PASS');
          console.log('pasted Shopee share URL detection PASS');
          console.log('fast target controls PASS');
          console.log('platform select + persistence PASS');
          console.log('tab navigation PASS');
          console.log('core resources PASS');
          await browser.close();
          EOF
          node quickbuy-smoke.mjs
